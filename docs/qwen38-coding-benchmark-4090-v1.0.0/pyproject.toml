[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcb4090"
version = "1.0.0"
description = "Reproducible Qwen3.8-27B coding benchmark for RTX 4090 and OpenAI-compatible local endpoints"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "QCB-4090 benchmark maintainers"}]
dependencies = []

[project.scripts]
qcb = "qcb.cli:main"

[tool.setuptools]
packages = ["qcb"]
