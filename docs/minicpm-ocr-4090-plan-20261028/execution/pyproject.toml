[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrbench-4090"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "PyMuPDF==1.26.7", "apted==1.0.3", "lxml==5.4.0", "html5lib==1.1"]

[project.scripts]
ocrbench = "ocrbench.cli:main"

[tool.setuptools.packages.find]
include = ["ocrbench*"]
